services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arvex
      POSTGRES_USER: arvex
      POSTGRES_PASSWORD: change-me
    ports: ["5432:5432"]
    volumes: ["arvex-postgres:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: .
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    depends_on: [postgres, redis]
    ports: ["8000:8000"]

  bot:
    build: .
    command: python -m apps.bot.main
    env_file: .env
    depends_on: [api]

  worker:
    build: .
    command: python -m apps.worker.main
    env_file: .env
    depends_on: [postgres, redis]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arvex-vps:/srv/arvex/vps

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./apps/web:/app
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  arvex-postgres:
  arvex-vps:
