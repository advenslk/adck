[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "arvex-hosting-saas"
version = "0.3.0"
description = "Discord-first hosting automation SaaS"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "asyncpg>=0.29,<1",
  "redis>=5,<7",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "docker>=7,<8",
  "discord.py>=2.7,<3",
  "groq>=0.31,<1",
  "python-dotenv>=1,<2",
  "cryptography>=43,<47",
  "alembic>=1.14,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["apps*"]
